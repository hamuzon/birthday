
# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  push:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GA_MEASUREMENT_ID: G-F8HVYVW05H

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Inject Google Analytics 4
        shell: bash
        run: |
          # 生成ファイルの権限を修正
          chmod -R u+rwX ./_site

          # google*.html を除外し、既存GA4タグがないHTMLに挿入
          find ./_site -type f -name "*.html" \
            ! -name "google*.html" -print0 |
          while IFS= read -r -d '' file; do
            if ! grep -q 'googletagmanager.com/gtag/js' "$file"; then
              FILE="$file" perl -0pi -e '
                BEGIN {
                  $ga = $ENV{"GA_MEASUREMENT_ID"};
                  $tag = qq{<!-- Google tag (gtag.js) -->\n};
                  $tag .= qq{<script async src="https://www.googletagmanager.com/gtag/js?id=$ga"></script>\n};
                  $tag .= qq{<script>\n};
                  $tag .= qq{window.dataLayer = window.dataLayer || [];\n};
                  $tag .= qq{function gtag(){dataLayer.push(arguments);}\n};
                  $tag .= qq{gtag("js", new Date());\n};
                  $tag .= qq{gtag("config", "$ga");\n};
                  $tag .= qq{</script>\n};
                }
                s/(<head\b[^>]*>)/$1\n$tag/i;
              ' "$file"
            fi
          done

      - name: Inject normalization script into HTML
        shell: bash
        run: |
          # 全てのHTMLファイルの<head>直後に挿入
          chmod -R u+rwX ./_site

          find ./_site -type f -name "*.html" \
            ! -name "google*.html" -print0 |
          while IFS= read -r -d '' file; do
            FILE="$file" perl -0pi -e '
              s{(<head\b[^>]*>)}{$1 . qq{\n<script>if(window.location.hostname.endsWith(".")){window.location.replace(window.location.href.replace(window.location.hostname,window.location.hostname.slice(0,-1)));}</script>}}ie;
            ' "$file"
          done

      - name: Remove sensitive files from deployment artifact
        shell: bash
        run: |
          # デプロイ対象から削除
          rm -rf ./_site/functions
          rm -rf ./_site/README.md
          rm -rf ./_site/README
          rm -rf ./_site/readme.md
          rm -rf ./_site/license
          rm -rf ./_site/LICENSE
          rm -rf ./_site/LICENSE.txt
          rm -rf ./_site/_redirects.md
          rm -rf ./_site/_redirects

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
